exclude = [
    ".git",
    ".vscode",
    "__pycache__",
    ".venv",
    "build",
    "dist",
    ".mypy_cache",
    ".pytest_cache",
]

line-length = 88
indent-width = 4
target-version = "py311"
src = ["src"]

[lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = []
fixable = ["ALL"]

[lint.isort]
known-first-party = ["wikibase_pipeline"]

[format]
quote-style = "double"
indent-style = "space"
