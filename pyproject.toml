[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wikibase-pipeline"
version = "0.1.0"
description = "Pipeline to generate RDF from mappings and populate Wikibase"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Liu Eléna"}
]

dependencies = [
    "morph-kgc==2.10.0",
    "rdflib==7.2.1",
    "requests==2.32.5",
    "python-dotenv==1.2.2"
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.5",
    "pytest==9.0.2",
    "pre-commit==4.5.1",
    "ipykernel==7.2.0"
]

[tool.setuptools.packages.find]
where = ["src"]
