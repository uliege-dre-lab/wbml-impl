[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wbml-impl"
version = "0.1.0"
description = "Reference implementation of WBML (Wikibase Mapping Language)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "morph-kgc==2.10.0",
    "rdflib==7.2.1",
    "requests==2.32.5",
    "python-dotenv==1.2.2"
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.5",
    "pre-commit==4.5.1",
    "ipykernel==7.2.0"
]

[tool.setuptools.packages.find]
where = ["code"]

[tool.setuptools.package-data]
wikibase_pipeline = ["sparql/**/*.rq"]
